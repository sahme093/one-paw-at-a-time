<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title + description are hardcoded here (not pulled from src/config.js)
      because index.html is read by browsers/crawlers before React ever runs.
      If you reuse this site for a different salon, update these two tags
      AND src/config.js so they stay in sync.
    -->
    <title>One Paw at a Time Grooming | Dog Grooming in Menifee, CA</title>
    <meta
      name="description"
      content="One Paw at a Time Grooming is a one-on-one, home-based dog groomer in Menifee, CA. Cage-free, low-stress grooming with the same groomer every visit, open daily 9am–5pm. Call (951) 565-0191."
    />

    <link rel="icon" type="image/webp" href="/assets/logo-mark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
